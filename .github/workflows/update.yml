name: 更新民生要闻

on:
  schedule:
    # UTC 23:20 = 北京时间次日 07:20
    - cron: "20 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 抓取并筛选
        run: python3 scripts/fetch_news.py

      - name: 提交更新
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          if git diff --quiet data.json; then
            echo "今日无新增条目，跳过提交"
          else
            git add data.json
            git commit -m "chore: 更新民生要闻 $(date -u +%F)"
            git push
          fi
